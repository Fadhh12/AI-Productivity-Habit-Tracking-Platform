<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Continuum — Offline</title>
    <style>
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f9fafb; color: #16171d; font-family: system-ui, sans-serif; text-align: center; padding: 24px; }
      main { max-width: 360px; }
      h1 { font-size: 22px; margin: 0 0 8px; }
      p { color: #52525b; line-height: 1.5; margin: 0 0 20px; }
      button { background: #ccff00; border: 0; border-radius: 999px; padding: 10px 24px; font-weight: 700; font-size: 15px; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <h1>Kamu sedang offline</h1>
      <p>Halaman ini belum pernah dibuka saat online, jadi belum tersimpan di perangkat. Sambungkan internet lalu coba lagi. Halaman yang pernah kamu buka tetap bisa diakses.</p>
      <button onclick="location.reload()">Coba lagi</button>
    </main>
  </body>
</html>
